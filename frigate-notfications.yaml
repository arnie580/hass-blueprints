blueprint:
  name: Frigate Notifications
  domain: automation
  input:
    camera:
      name: Camera
      selector:
        entity:
          filter:
            integration: Frigate
            domain: camera            
    notify:
      name: Notification Target
      selector:
        entity:
          multiple: true
          filter:
            domain: notify
    conditions:
      name: Notification Condition(s)
        selector:
          condition:
    mqtt:
      name: MQTT Path
      default: 'frigate/reviews'
      selector:
        text:
      
      
