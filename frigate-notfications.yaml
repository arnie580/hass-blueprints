blueprint:
  name: Frigate Notifications
  domain: automation
  input:
    camera:
      name: Camera
      selector:
        entity:
          filter:
            integration: frigate
            domain: camera            
    notify:
      name: Notification Target
      selector:
        entity:
          multiple: true
          filter:
            domain: notify
    conditions:
      name: Notification Condition(s)
      default: []
      selector:
        condition:
    mqtt:
      name: MQTT Path
      default: 'frigate/reviews'
      selector:
        text: 

variables:
  camera_entity: !input camera
  camera_name: "{{ camera_entity | replace ('camera.', '')}}"
  
      
